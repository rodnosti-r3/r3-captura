<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Captura Diaria — Farmacias R3</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f5f5f3; color: #1a1a1a; min-height: 100vh; }

    /* ── LOGIN ── */
    #loginScreen {
      min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 1rem;
    }
    .login-card {
      background: #fff; border: 1px solid #e8e8e8; border-radius: 16px;
      padding: 2.5rem 2rem; width: 100%; max-width: 380px;
    }
    .login-logo { text-align: center; margin-bottom: 2rem; }
    .login-logo h1 { font-size: 20px; font-weight: 600; color: #1a1a1a; }
    .login-logo p { font-size: 13px; color: #888; margin-top: 4px; }
    .field-group { margin-bottom: 1rem; }
    .field-group label { display: block; font-size: 12px; font-weight: 600; color: #666; text-transform: uppercase; letter-spacing: .05em; margin-bottom: 6px; }
    .field-group input { width: 100%; padding: 10px 12px; border: 1px solid #e0e0e0; border-radius: 8px; font-size: 14px; color: #1a1a1a; background: #fff; outline: none; transition: border-color .15s; font-family: inherit; }
    .field-group input:focus { border-color: #0C447C; }
    .login-btn { width: 100%; padding: 11px; background: #0C447C; color: #fff; border: none; border-radius: 8px; font-size: 14px; font-weight: 600; cursor: pointer; margin-top: 0.5rem; transition: background .15s; font-family: inherit; }
    .login-btn:hover { background: #185FA5; }
    .login-btn:disabled { opacity: .6; cursor: not-allowed; }
    .login-err { font-size: 13px; color: #A32D2D; background: #FCEBEB; border-radius: 6px; padding: 8px 12px; margin-top: 12px; display: none; }

    /* ── APP ── */
    #appScreen { display: none; }
    .topbar {
      background: #fff; border-bottom: 1px solid #e8e8e8;
      padding: 12px 1.5rem; display: flex; align-items: center; justify-content: space-between;
    }
    .topbar-title { font-size: 15px; font-weight: 600; color: #1a1a1a; }
    .topbar-user { display: flex; align-items: center; gap: 10px; }
    .user-badge { font-size: 12px; font-weight: 600; padding: 4px 12px; border-radius: 20px; }
    .badge-mad { background: #E6F1FB; color: #0C447C; }
    .badge-con { background: #E1F5EE; color: #085041; }
    .logout-btn { font-size: 12px; color: #888; background: none; border: 1px solid #e0e0e0; border-radius: 6px; padding: 4px 10px; cursor: pointer; font-family: inherit; }
    .logout-btn:hover { background: #f5f5f5; }

    .app { max-width: 580px; margin: 0 auto; padding: 2rem 1.25rem 4rem; }
    .card { background: #fff; border: 1px solid #e8e8e8; border-radius: 12px; padding: 1.25rem; margin-bottom: 14px; }
    .clabel { font-size: 11px; font-weight: 600; color: #999; text-transform: uppercase; letter-spacing: .07em; margin-bottom: 12px; }
    .drop { border: 1.5px dashed #ccc; border-radius: 8px; padding: 1.5rem 1rem; text-align: center; cursor: pointer; transition: all .15s; position: relative; }
    .drop:hover { border-color: #888; background: #fafafa; }
    .drop.loaded { border-style: solid; border-color: #9FE1CB; background: #f0fbf6; }
    .drop input[type=file] { position: absolute; inset: 0; opacity: 0; cursor: pointer; width: 100%; height: 100%; }
    .drop svg { display: block; margin: 0 auto 8px; color: #aaa; }
    .drop-t { font-size: 13px; color: #888; }
    .drop-t strong { color: #333; font-weight: 600; }
    .fname { font-size: 12px; color: #085041; margin-top: 6px; font-weight: 600; }
    .fields-card { opacity: .4; pointer-events: none; transition: opacity .25s; }
    .fields-card.active { opacity: 1; pointer-events: all; }
    .field-row { display: flex; align-items: center; gap: 12px; padding: 10px 0; border-bottom: 1px solid #f0f0f0; }
    .field-row:last-child { border-bottom: none; }
    .field-lbl { font-size: 13px; color: #666; width: 115px; flex-shrink: 0; }
    .field-prefix { font-size: 13px; color: #bbb; }
    .field-static { flex: 1; font-size: 15px; font-weight: 600; text-align: right; color: #0C447C; }
    .field-row.ref-row { background: #f7f9ff; margin: 0 -1.25rem; padding: 10px 1.25rem; border-bottom: 1px solid #e8e8e8; }
    .ref-lbl { font-size: 13px; font-weight: 600; color: #333; width: 115px; flex-shrink: 0; }
    input[type=number] { flex: 1; border: none; background: transparent; font-size: 14px; font-weight: 600; color: #1a1a1a; text-align: right; outline: none; font-family: inherit; }
    input[type=number]::placeholder { color: #ccc; font-weight: 400; }
    .spacer { height: 10px; }
    .total-row { display: flex; align-items: center; gap: 12px; padding: 12px 0 4px; border-top: 1px solid #e8e8e8; margin-top: 4px; }
    .total-lbl { font-size: 13px; font-weight: 600; color: #666; width: 115px; flex-shrink: 0; }
    .total-val { flex: 1; font-size: 17px; font-weight: 600; text-align: right; color: #1a1a1a; }
    .diff-box { border-radius: 8px; padding: 10px 14px; font-size: 13px; display: flex; align-items: center; justify-content: space-between; margin-top: 12px; }
    .diff-ok { background: #E1F5EE; color: #085041; }
    .diff-err { background: #FCEBEB; color: #791F1F; }
    .diff-lbl { font-weight: 600; }
    .diff-val { font-weight: 600; font-size: 14px; }
    .actions { display: flex; gap: 10px; margin-top: 1.25rem; flex-wrap: wrap; }
    .btn { padding: 10px 22px; font-size: 14px; font-weight: 500; border-radius: 8px; border: 1px solid #d0d0d0; background: transparent; color: #333; cursor: pointer; transition: all .15s; font-family: inherit; }
    .btn:hover { background: #f5f5f5; }
    .btn:active { transform: scale(.98); }
    .btn.primary { background: #0C447C; color: #fff; border-color: #0C447C; }
    .btn.primary:hover { background: #185FA5; }
    .btn:disabled { opacity: .4; cursor: not-allowed; transform: none; }
    .status { font-size: 13px; margin-top: 12px; }
    .status.ok { color: #085041; font-weight: 500; }
    .status.err { color: #A32D2D; }
  </style>
</head>
<body>

  <!-- LOGIN -->
  <div id="loginScreen">
    <div class="login-card">
      <div class="login-logo">
        <h1>Farmacias R3</h1>
        <p>Captura diaria de ingresos</p>
      </div>
      <div class="field-group">
        <label>Correo</label>
        <input type="email" id="loginEmail" placeholder="sucursal@farmacias-r3.com" autocomplete="username">
      </div>
      <div class="field-group">
        <label>Contraseña</label>
        <input type="password" id="loginPass" placeholder="••••••••" autocomplete="current-password" onkeydown="if(event.key==='Enter')doLogin()">
      </div>
      <button class="login-btn" id="loginBtn" onclick="doLogin()">Entrar</button>
      <div class="login-err" id="loginErr">Correo o contraseña incorrectos.</div>
    </div>
  </div>

  <!-- APP -->
  <div id="appScreen">
    <div class="topbar">
      <span class="topbar-title">Captura diaria — Farmacias R3</span>
      <div class="topbar-user">
        <span class="user-badge" id="userBadge"></span>
        <button class="logout-btn" onclick="doLogout()">Salir</button>
      </div>
    </div>

    <div class="app">
      <div class="card">
        <div class="clabel">1 — Conciliación PDF</div>
        <div class="drop" id="dropzone" onclick="document.getElementById('pdfIn').click()">
          <input type="file" id="pdfIn" accept=".pdf" onchange="loadPDF(this)" onclick="event.stopPropagation()">
          <svg width="28" height="28" viewBox="0 0 28 28" fill="none">
            <rect x="3" y="1" width="16" height="22" rx="2" stroke="currentColor" stroke-width="1.4"/>
            <path d="M15 1v6h6" stroke="currentColor" stroke-width="1.4"/>
            <path d="M7 11h14M7 15h10M7 19h6" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
          </svg>
          <div class="drop-t"><strong>Seleccionar PDF</strong><br>Conciliación del día</div>
          <div class="fname" id="fname"></div>
        </div>
      </div>

      <div class="card fields-card" id="fieldsCard">
        <div class="clabel">2 — Formas de pago</div>
        <div class="field-row ref-row">
          <span class="ref-lbl">Venta total</span>
          <span class="field-static" id="ventaRow">—</span>
        </div>
        <div class="spacer"></div>
        <div class="field-row">
          <span class="field-lbl">Depósito 1</span>
          <span class="field-prefix">$</span>
          <input type="number" id="dep1" placeholder="0.00" step="0.01" oninput="recalc()">
        </div>
        <div class="field-row">
          <span class="field-lbl">Depósito 2</span>
          <span class="field-prefix">$</span>
          <input type="number" id="dep2" placeholder="0.00" step="0.01" oninput="recalc()">
        </div>
        <div class="field-row">
          <span class="field-lbl">Crédito</span>
          <span class="field-prefix">$</span>
          <input type="number" id="cred" placeholder="0.00" step="0.01" oninput="recalc()">
        </div>
        <div class="field-row">
          <span class="field-lbl">Débito</span>
          <span class="field-prefix">$</span>
          <input type="number" id="deb" placeholder="0.00" step="0.01" oninput="recalc()">
        </div>
        <div class="field-row">
          <span class="field-lbl">Amex</span>
          <span class="field-prefix">$</span>
          <input type="number" id="amex" placeholder="0.00" step="0.01" oninput="recalc()">
        </div>
        <div class="total-row">
          <span class="total-lbl">Total capturado</span>
          <span class="total-val" id="totalCap">$0.00</span>
        </div>
        <div id="diffBox"></div>
      </div>

      <div class="actions">
        <button class="btn primary" id="submitBtn" disabled onclick="enviar()">Registrar en Google Sheets</button>
        <button class="btn" onclick="limpiar()">Limpiar</button>
      </div>
      <div class="status" id="statusMsg"></div>
    </div>
  </div>

  <script>
    const SUPABASE_URL = 'https://xvvqgkmnfegnxjsnpbob.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inh2dnFna21uZmVnbnhqc25wYm9iIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzY3ODgyNTIsImV4cCI6MjA5MjM2NDI1Mn0.XalAcjkhMPTobfOWT3zLC04Hs7lVtPbJdeTOwCS9Y4I';
    const { createClient } = supabase;
    const sb = createClient(SUPABASE_URL, SUPABASE_KEY);

    const SUCURSAL_MAP = {
      '76662r3@gmail.com': 'Madrazo',
      '77747r3@gmail.com': 'Contadero',
    };

    let currentSucursal = '';
    let ventaPDF = null;

    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

    async function doLogin() {
      const email = document.getElementById('loginEmail').value.trim();
      const pass = document.getElementById('loginPass').value;
      const btn = document.getElementById('loginBtn');
      const err = document.getElementById('loginErr');
      err.style.display = 'none';
      btn.disabled = true;
      btn.textContent = 'Entrando...';
      const { data, error } = await sb.auth.signInWithPassword({ email, password: pass });
      if (error || !data.user) {
        err.style.display = 'block';
        btn.disabled = false;
        btn.textContent = 'Entrar';
        return;
      }
      const suc = SUCURSAL_MAP[email] || email;
      mostrarApp(suc);
    }

    function mostrarApp(suc) {
      currentSucursal = suc;
      document.getElementById('loginScreen').style.display = 'none';
      document.getElementById('appScreen').style.display = 'block';
      const badge = document.getElementById('userBadge');
      badge.textContent = suc;
      badge.className = 'user-badge ' + (suc === 'Madrazo' ? 'badge-mad' : 'badge-con');
    }

    async function doLogout() {
      await sb.auth.signOut();
      document.getElementById('loginScreen').style.display = 'flex';
      document.getElementById('appScreen').style.display = 'none';
      document.getElementById('loginEmail').value = '';
      document.getElementById('loginPass').value = '';
      document.getElementById('loginBtn').textContent = 'Entrar';
      limpiar();
    }

    sb.auth.onAuthStateChange((event, session) => {
      if (session) {
        const suc = SUCURSAL_MAP[session.user.email] || session.user.email;
        mostrarApp(suc);
      }
    });

    async function loadPDF(input) {
      const file = input.files[0]; if (!file) return;
      document.getElementById('fname').textContent = file.name;
      document.getElementById('dropzone').classList.add('loaded');
      document.getElementById('ventaRow').textContent = 'Leyendo...';
      const ab = await file.arrayBuffer();
      const pdf = await pdfjsLib.getDocument({ data: ab }).promise;
      let txt = '';
      for (let i = 1; i <= pdf.numPages; i++) {
        const pg = await pdf.getPage(i);
        const tc = await pg.getTextContent();
        txt += tc.items.map(x => x.str).join(' ') + '\n';
      }
      const patterns = [
        /Venta\s+Neta\s*\+\s*Iva\s+\$?([\d,]+\.?\d{0,2})/i,
        /Total\s+\$?([\d,]+\.\d{2})\s+\$?([\d,]+\.\d{2})\s*$/im,
        /Venta\s+Neta\s+[A-Z\s0-9%$.,]+?([\d,]+\.\d{2})\s+([\d,]+\.\d{2})\s+([\d,]+\.\d{2})/i,
      ];
      let found = null;
      for (const p of patterns) {
        const m = txt.match(p);
        if (m) {
          const candidates = m.slice(1).map(v => parseFloat((v || '0').replace(/,/g, '')));
          found = Math.max(...candidates.filter(v => v > 1000));
          if (found > 0) break;
        }
      }
      if (!found || found <= 0) {
        const allNums = [...txt.matchAll(/\$\s*([\d,]+\.\d{2})/g)]
          .map(m => parseFloat(m[1].replace(/,/g, '')))
          .filter(v => v > 5000 && v < 500000);
        if (allNums.length) found = allNums.sort((a, b) => b - a)[0];
      }
      ventaPDF = found || null;
      const vr = document.getElementById('ventaRow');
      if (ventaPDF) {
        vr.textContent = fmt(ventaPDF);
        document.getElementById('fieldsCard').classList.add('active');
      } else {
        vr.textContent = 'No encontrado';
      }
      recalc();
    }

    function fmt(n) {
      if (n === null || n === undefined) return '—';
      return '$' + Number(n).toLocaleString('es-MX', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    }

    function val(id) { return parseFloat(document.getElementById(id).value) || 0; }

    function recalc() {
      const total = val('dep1') + val('dep2') + val('cred') + val('deb') + val('amex');
      document.getElementById('totalCap').textContent = fmt(total);
      const db = document.getElementById('diffBox');
      const sb2 = document.getElementById('submitBtn');
      if (!ventaPDF || total === 0) { db.innerHTML = ''; sb2.disabled = true; return; }
      const diff = Math.abs(total - ventaPDF);
      if (diff < 1) {
        db.innerHTML = `<div class="diff-box diff-ok"><span class="diff-lbl">Cuadrado</span><span class="diff-val">${fmt(ventaPDF)}</span></div>`;
        sb2.disabled = false;
      } else {
        const signo = total > ventaPDF ? 'Sobra' : 'Falta';
        db.innerHTML = `<div class="diff-box diff-err"><span class="diff-lbl">${signo} ${fmt(diff)}</span><span class="diff-val">No cuadra</span></div>`;
        sb2.disabled = true;
      }
    }

    function enviar() {
      const sm = document.getElementById('statusMsg');
      sm.className = 'status';
      sm.textContent = 'Enviando a Google Sheets...';
      document.getElementById('submitBtn').disabled = true;
      const SCRIPT_URL = 'TU_URL_AQUI';
      const payload = {
        sucursal: currentSucursal,
        fecha: new Date().toLocaleDateString('es-MX'),
        ventaTotal: ventaPDF,
        deposito1: val('dep1'),
        deposito2: val('dep2'),
        credito: val('cred'),
        debito: val('deb'),
        amex: val('amex'),
        totalCapturado: val('dep1') + val('dep2') + val('cred') + val('deb') + val('amex')
      };
      if (SCRIPT_URL === 'TU_URL_AQUI') {
        setTimeout(() => {
          sm.className = 'status ok';
          sm.textContent = 'Modo prueba — ' + currentSucursal + ' · ' + payload.fecha;
          document.getElementById('submitBtn').disabled = false;
        }, 800);
        return;
      }
      fetch(SCRIPT_URL, { method: 'POST', body: JSON.stringify(payload) })
        .then(r => r.json())
        .then(() => {
          sm.className = 'status ok';
          sm.textContent = 'Registro guardado — ' + currentSucursal + ' · ' + payload.fecha;
        })
        .catch(() => {
          sm.className = 'status err';
          sm.textContent = 'Error al conectar. Intenta de nuevo.';
          document.getElementById('submitBtn').disabled = false;
        });
    }

    function limpiar() {
      ['dep1', 'dep2', 'cred', 'deb', 'amex'].forEach(id => document.getElementById(id).value = '');
      document.getElementById('pdfIn').value = '';
      document.getElementById('fname').textContent = '';
      document.getElementById('dropzone').classList.remove('loaded');
      document.getElementById('fieldsCard').classList.remove('active');
      document.getElementById('ventaRow').textContent = '—';
      document.getElementById('totalCap').textContent = '$0.00';
      document.getElementById('diffBox').innerHTML = '';
      document.getElementById('statusMsg').textContent = '';
      document.getElementById('submitBtn').disabled = true;
      ventaPDF = null;
    }
  </script>
</body>
</html>
