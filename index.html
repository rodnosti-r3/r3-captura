<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Captura Diaria — Farmacias R3</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.0/dist/umd/supabase.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f5f5f3; color: #1a1a1a; min-height: 100vh; }

    /* LOGIN */
    #loginScreen { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 1rem; }
    .login-card { background: #fff; border: 1px solid #e8e8e8; border-radius: 16px; padding: 2.5rem 2rem; width: 100%; max-width: 380px; }
    .login-logo { text-align: center; margin-bottom: 2rem; }
    .login-logo h1 { font-size: 22px; font-weight: 700; color: #1a1a1a; }
    .login-logo p { font-size: 13px; color: #888; margin-top: 4px; }
    .field-group { margin-bottom: 1rem; }
    .field-group label { display: block; font-size: 12px; font-weight: 600; color: #666; text-transform: uppercase; letter-spacing: .05em; margin-bottom: 6px; }
    .field-group input { width: 100%; padding: 10px 12px; border: 1px solid #e0e0e0; border-radius: 8px; font-size: 14px; color: #1a1a1a; background: #fff; outline: none; transition: border-color .15s; font-family: inherit; }
    .field-group input:focus { border-color: #0C447C; }
    .login-btn { width: 100%; padding: 11px; background: #0C447C; color: #fff; border: none; border-radius: 8px; font-size: 14px; font-weight: 600; cursor: pointer; margin-top: 0.5rem; transition: background .15s; font-family: inherit; }
    .login-btn:hover { background: #185FA5; }
    .login-btn:disabled { opacity: .6; cursor: not-allowed; }
    .login-err { font-size: 13px; color: #A32D2D; background: #FCEBEB; border-radius: 6px; padding: 8px 12px; margin-top: 12px; display: none; }

    /* APP */
    #appScreen { display: none; }
    .topbar { background: #fff; border-bottom: 1px solid #e8e8e8; padding: 12px 1.5rem; display: flex; align-items: center; justify-content: space-between; }
    .topbar-title { font-size: 15px; font-weight: 600; }
    .topbar-right { display: flex; align-items: center; gap: 10px; }
    .user-badge { font-size: 12px; font-weight: 600; padding: 4px 12px; border-radius: 20px; }
    .badge-mad { background: #E6F1FB; color: #0C447C; }
    .badge-con { background: #E1F5EE; color: #085041; }
    .badge-adm { background: #FAEEDA; color: #633806; }
    .logout-btn { font-size: 12px; color: #888; background: none; border: 1px solid #e0e0e0; border-radius: 6px; padding: 4px 10px; cursor: pointer; font-family: inherit; }
    .logout-btn:hover { background: #f5f5f5; }
    .nav-tabs { background: #fff; border-bottom: 1px solid #e8e8e8; display: flex; padding: 0 1.5rem; }
    .nav-tab { padding: 12px 16px; font-size: 13px; font-weight: 500; color: #888; cursor: pointer; border-bottom: 2px solid transparent; transition: all .15s; background: none; border-top: none; border-left: none; border-right: none; font-family: inherit; }
    .nav-tab.active { color: #0C447C; border-bottom-color: #0C447C; }
    .screen { display: none; }
    .screen.active { display: block; }
    .app { max-width: 620px; margin: 0 auto; padding: 2rem 1.25rem 4rem; }

    /* CALENDARIO */
    .cal-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 1.25rem; }
    .cal-title { font-size: 17px; font-weight: 600; }
    .cal-nav { display: flex; gap: 6px; }
    .cal-btn { background: #fff; border: 1px solid #e0e0e0; border-radius: 6px; padding: 5px 12px; font-size: 13px; cursor: pointer; font-family: inherit; }
    .cal-btn:hover { background: #f5f5f5; }
    .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
    .cal-day-name { text-align: center; font-size: 11px; font-weight: 600; color: #aaa; text-transform: uppercase; padding: 4px 0; }
    .cal-day { aspect-ratio: 1; border-radius: 8px; display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 14px; font-weight: 500; cursor: pointer; border: 1px solid transparent; transition: all .15s; position: relative; }
    .cal-day.empty { cursor: default; }
    .cal-day.future { color: #ccc; cursor: default; }
    .cal-day.pending { background: #fff; border-color: #e0e0e0; color: #1a1a1a; }
    .cal-day.pending:hover { border-color: #0C447C; background: #E6F1FB; }
    .cal-day.done { background: #E1F5EE; border-color: #9FE1CB; color: #085041; cursor: default; }
    .cal-day.done-admin { background: #E1F5EE; border-color: #9FE1CB; color: #085041; cursor: pointer; }
    .cal-day.done-admin:hover { background: #FAEEDA; border-color: #FAC775; }
    .cal-day.today { border-color: #0C447C; font-weight: 700; }
    .cal-day .dot { width: 5px; height: 5px; border-radius: 50%; background: #1D9E75; margin-top: 3px; }
    .cal-legend { display: flex; gap: 16px; margin-top: 1rem; flex-wrap: wrap; }
    .cal-legend-item { display: flex; align-items: center; gap: 6px; font-size: 12px; color: #666; }
    .cal-legend-dot { width: 12px; height: 12px; border-radius: 3px; }

    /* ADMIN SUCURSAL TABS */
    .suc-tabs { display: flex; gap: 8px; margin-bottom: 1.25rem; }
    .suc-tab { padding: 6px 18px; border-radius: 20px; font-size: 13px; font-weight: 500; cursor: pointer; border: 1px solid #d0d0d0; background: transparent; color: #666; transition: all .15s; font-family: inherit; }
    .suc-tab.blue { background: #E6F1FB; color: #0C447C; border-color: #B5D4F4; }
    .suc-tab.teal { background: #E1F5EE; color: #085041; border-color: #9FE1CB; }

    /* CAPTURA FORM */
    .back-btn { display: flex; align-items: center; gap: 6px; font-size: 13px; color: #666; background: none; border: none; cursor: pointer; margin-bottom: 1.25rem; font-family: inherit; padding: 0; }
    .back-btn:hover { color: #1a1a1a; }
    .day-badge { display: inline-block; font-size: 13px; font-weight: 600; padding: 4px 14px; border-radius: 20px; background: #E6F1FB; color: #0C447C; margin-bottom: 1.25rem; }
    .card { background: #fff; border: 1px solid #e8e8e8; border-radius: 12px; padding: 1.25rem; margin-bottom: 14px; }
    .clabel { font-size: 11px; font-weight: 600; color: #999; text-transform: uppercase; letter-spacing: .07em; margin-bottom: 12px; }
    .drop { border: 1.5px dashed #ccc; border-radius: 8px; padding: 1.5rem 1rem; text-align: center; cursor: pointer; transition: all .15s; position: relative; }
    .drop:hover { border-color: #888; background: #fafafa; }
    .drop.loaded { border-style: solid; border-color: #9FE1CB; background: #f0fbf6; }
    .drop input[type=file] { position: absolute; inset: 0; opacity: 0; cursor: pointer; width: 100%; height: 100%; }
    .drop svg { display: block; margin: 0 auto 8px; color: #aaa; }
    .drop-t { font-size: 13px; color: #888; }
    .drop-t strong { color: #333; font-weight: 600; }
    .fname { font-size: 12px; color: #085041; margin-top: 6px; font-weight: 600; }
    .fields-card { opacity: .4; pointer-events: none; transition: opacity .25s; }
    .fields-card.active { opacity: 1; pointer-events: all; }
    .field-row { display: flex; align-items: center; gap: 12px; padding: 10px 0; border-bottom: 1px solid #f0f0f0; }
    .field-row:last-child { border-bottom: none; }
    .field-lbl { font-size: 13px; color: #666; width: 115px; flex-shrink: 0; }
    .field-prefix { font-size: 13px; color: #bbb; }
    .field-static { flex: 1; font-size: 15px; font-weight: 600; text-align: right; color: #0C447C; }
    .field-row.ref-row { background: #f7f9ff; margin: 0 -1.25rem; padding: 10px 1.25rem; border-bottom: 1px solid #e8e8e8; }
    .ref-lbl { font-size: 13px; font-weight: 600; color: #333; width: 115px; flex-shrink: 0; }
    input[type=number] { flex: 1; border: none; background: transparent; font-size: 14px; font-weight: 600; color: #1a1a1a; text-align: right; outline: none; font-family: inherit; }
    input[type=number]::placeholder { color: #ccc; font-weight: 400; }
    .spacer { height: 10px; }
    .total-row { display: flex; align-items: center; gap: 12px; padding: 12px 0 4px; border-top: 1px solid #e8e8e8; margin-top: 4px; }
    .total-lbl { font-size: 13px; font-weight: 600; color: #666; width: 115px; flex-shrink: 0; }
    .total-val { flex: 1; font-size: 17px; font-weight: 600; text-align: right; }
    .diff-box { border-radius: 8px; padding: 10px 14px; font-size: 13px; display: flex; align-items: center; justify-content: space-between; margin-top: 12px; }
    .diff-ok { background: #E1F5EE; color: #085041; }
    .diff-err { background: #FCEBEB; color: #791F1F; }
    .diff-lbl { font-weight: 600; }
    .diff-val { font-weight: 600; font-size: 14px; }
    .actions { display: flex; gap: 10px; margin-top: 1.25rem; flex-wrap: wrap; }
    .btn { padding: 10px 22px; font-size: 14px; font-weight: 500; border-radius: 8px; border: 1px solid #d0d0d0; background: transparent; color: #333; cursor: pointer; transition: all .15s; font-family: inherit; }
    .btn:hover { background: #f5f5f5; }
    .btn:active { transform: scale(.98); }
    .btn.primary { background: #0C447C; color: #fff; border-color: #0C447C; }
    .btn.primary:hover { background: #185FA5; }
    .btn:disabled { opacity: .4; cursor: not-allowed; transform: none; }
    .status-msg { font-size: 13px; margin-top: 12px; }
    .status-msg.ok { color: #085041; font-weight: 500; }
    .status-msg.err { color: #A32D2D; }

    /* HISTORIAL ADMIN */
    .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 1.5rem; }
    .stat-card { background: #fff; border: 1px solid #e8e8e8; border-radius: 10px; padding: 1rem 1.25rem; }
    .stat-label { font-size: 12px; color: #888; margin-bottom: 4px; }
    .stat-val { font-size: 20px; font-weight: 600; color: #1a1a1a; }
    .stat-sub { font-size: 12px; color: #aaa; margin-top: 2px; }
    .hist-list { display: flex; flex-direction: column; gap: 8px; }
    .hist-item { background: #fff; border: 1px solid #e8e8e8; border-radius: 10px; padding: 12px 16px; display: flex; align-items: center; justify-content: space-between; }
    .hist-left { display: flex; flex-direction: column; gap: 2px; }
    .hist-fecha { font-size: 14px; font-weight: 600; }
    .hist-suc { font-size: 12px; color: #888; }
    .hist-venta { font-size: 15px; font-weight: 600; color: #0C447C; }
    .hist-empty { text-align: center; padding: 3rem; font-size: 14px; color: #888; }
    .suc-filter { display: flex; gap: 8px; margin-bottom: 1rem; flex-wrap: wrap; }
    .filter-btn { padding: 5px 14px; border-radius: 20px; font-size: 12px; font-weight: 500; cursor: pointer; border: 1px solid #e0e0e0; background: transparent; color: #666; font-family: inherit; transition: all .15s; }
    .filter-btn.active { background: #0C447C; color: #fff; border-color: #0C447C; }
  </style>
</head>
<body>

<div id="loginScreen">
  <div class="login-card">
    <div class="login-logo">
      <h1>Farmacias R3</h1>
      <p>Captura diaria de ingresos</p>
    </div>
    <div class="field-group">
      <label>Correo</label>
      <input type="email" id="loginEmail" placeholder="correo@gmail.com" autocomplete="username">
    </div>
    <div class="field-group">
      <label>Contraseña</label>
      <input type="password" id="loginPass" placeholder="••••••••" autocomplete="current-password" onkeydown="if(event.key==='Enter')doLogin()">
    </div>
    <button class="login-btn" id="loginBtn" onclick="doLogin()">Entrar</button>
    <div class="login-err" id="loginErr">Correo o contraseña incorrectos.</div>
  </div>
</div>

<div id="appScreen">
  <div class="topbar">
    <span class="topbar-title">Farmacias R3</span>
    <div class="topbar-right">
      <span class="user-badge" id="userBadge"></span>
      <button class="logout-btn" onclick="doLogout()">Salir</button>
    </div>
  </div>
  <div class="nav-tabs" id="navTabs">
    <button class="nav-tab active" id="tab-calendario" onclick="switchTab('calendario')">Calendario</button>
    <button class="nav-tab" id="tab-historial" onclick="switchTab('historial')">Historial</button>
  </div>

  <!-- CALENDARIO -->
  <div class="screen active" id="screen-calendario">
    <div class="app">
      <div id="adminSucTabs" style="display:none">
        <div class="suc-tabs">
          <button class="suc-tab blue" id="st-mad" onclick="setAdminSuc('madrazo')">Madrazo</button>
          <button class="suc-tab" id="st-con" onclick="setAdminSuc('contadero')">Contadero</button>
        </div>
      </div>
      <div class="cal-header">
        <span class="cal-title" id="calTitle"></span>
        <div class="cal-nav">
          <button class="cal-btn" onclick="cambiarMes(-1)">&#8592;</button>
          <button class="cal-btn" onclick="cambiarMes(1)">&#8594;</button>
        </div>
      </div>
      <div class="cal-grid" id="calGrid"></div>
      <div class="cal-legend">
        <div class="cal-legend-item"><div class="cal-legend-dot" style="background:#E1F5EE;border:1px solid #9FE1CB"></div> Completado</div>
        <div class="cal-legend-item"><div class="cal-legend-dot" style="background:#fff;border:1px solid #e0e0e0"></div> Pendiente</div>
        <div class="cal-legend-item"><div class="cal-legend-dot" style="background:#f5f5f3;border:1px solid #e0e0e0"></div> Futuro</div>
      </div>
    </div>
  </div>

  <!-- CAPTURA -->
  <div class="screen" id="screen-captura">
    <div class="app">
      <button class="back-btn" onclick="switchTab('calendario')">&#8592; Volver al calendario</button>
      <div class="day-badge" id="dayBadge"></div>
      <div class="card">
        <div class="clabel">1 — Conciliación PDF</div>
        <div class="drop" id="dropzone" onclick="document.getElementById('pdfIn').click()">
          <input type="file" id="pdfIn" accept=".pdf" onchange="loadPDF(this)" onclick="event.stopPropagation()">
          <svg width="28" height="28" viewBox="0 0 28 28" fill="none">
            <rect x="3" y="1" width="16" height="22" rx="2" stroke="currentColor" stroke-width="1.4"/>
            <path d="M15 1v6h6" stroke="currentColor" stroke-width="1.4"/>
            <path d="M7 11h14M7 15h10M7 19h6" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
          </svg>
          <div class="drop-t"><strong>Seleccionar PDF</strong><br>Conciliación del día</div>
          <div class="fname" id="fname"></div>
        </div>
      </div>
      <div class="card fields-card" id="fieldsCard">
        <div class="clabel">2 — Formas de pago</div>
        <div class="field-row ref-row">
          <span class="ref-lbl">Venta total</span>
          <span class="field-static" id="ventaRow">—</span>
        </div>
        <div class="spacer"></div>
        <div class="field-row"><span class="field-lbl">Depósito 1</span><span class="field-prefix">$</span><input type="number" id="dep1" placeholder="0.00" step="0.01" oninput="recalc()"></div>
        <div class="field-row"><span class="field-lbl">Depósito 2</span><span class="field-prefix">$</span><input type="number" id="dep2" placeholder="0.00" step="0.01" oninput="recalc()"></div>
        <div class="field-row"><span class="field-lbl">Crédito</span><span class="field-prefix">$</span><input type="number" id="cred" placeholder="0.00" step="0.01" oninput="recalc()"></div>
        <div class="field-row"><span class="field-lbl">Débito</span><span class="field-prefix">$</span><input type="number" id="deb" placeholder="0.00" step="0.01" oninput="recalc()"></div>
        <div class="field-row"><span class="field-lbl">Amex</span><span class="field-prefix">$</span><input type="number" id="amex" placeholder="0.00" step="0.01" oninput="recalc()"></div>
        <div class="total-row">
          <span class="total-lbl">Total capturado</span>
          <span class="total-val" id="totalCap">$0.00</span>
        </div>
        <div id="diffBox"></div>
      </div>
      <div class="actions">
        <button class="btn primary" id="submitBtn" disabled onclick="enviar()">Registrar día</button>
        <button class="btn" onclick="limpiarForm()">Limpiar</button>
      </div>
      <div class="status-msg" id="statusMsg"></div>
    </div>
  </div>

  <!-- HISTORIAL -->
  <div class="screen" id="screen-historial">
    <div class="app">
      <div class="stats-grid" id="statsGrid"></div>
      <div class="suc-filter">
        <button class="filter-btn active" id="f-todos" onclick="filtrarHist('todos')">Todos</button>
        <button class="filter-btn" id="f-madrazo" onclick="filtrarHist('madrazo')">Madrazo</button>
        <button class="filter-btn" id="f-contadero" onclick="filtrarHist('contadero')">Contadero</button>
      </div>
      <div id="histContent"><div class="hist-empty">Cargando...</div></div>
    </div>
  </div>
</div>

<script>
const SUPABASE_URL = 'https://xvvqgkmnfegnxjsnpbob.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inh2dnFna21uZmVnbnhqc25wYm9iIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzY3ODgyNTIsImV4cCI6MjA5MjM2NDI1Mn0.XalAcjkhMPTobfOWT3zLC04Hs7lVtPbJdeTOwCS9Y4I';
const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbx6mpRd-FtA0yKfNZH02WlsvgNk_DkfMsANmamwoeDnEHv9wsspUz18_BCpqEVcpNBgcQ/exec';
const ADMIN_EMAIL = 'rodnostir3@gmail.com';
const SUCURSAL_MAP = { '76662r3@gmail.com': 'madrazo', '77747r3@gmail.com': 'contadero' };

const { createClient } = supabase;
const sb = createClient(SUPABASE_URL, SUPABASE_KEY, {
  auth: {
    persistSession: true,
    autoRefreshToken: true,
    detectSessionInUrl: false
  }
});
pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

let currentUser = null, isAdmin = false, currentSucursal = '', adminSuc = 'madrazo';
let calYear = new Date().getFullYear(), calMonth = new Date().getMonth();
let registros = [], selectedDate = null, ventaPDF = null, histFiltro = 'todos';

const MESES = ['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
const DIAS = ['Dom','Lun','Mar','Mié','Jue','Vie','Sáb'];

async function doLogin() {
  const email = document.getElementById('loginEmail').value.trim();
  const pass = document.getElementById('loginPass').value;
  const btn = document.getElementById('loginBtn');
  const err = document.getElementById('loginErr');
  err.style.display = 'none';
  btn.disabled = true; btn.textContent = 'Entrando...';
  const { data, error } = await sb.auth.signInWithPassword({ email, password: pass });
  if (error || !data.user) {
    err.style.display = 'block';
    btn.disabled = false; btn.textContent = 'Entrar'; return;
  }
  iniciarApp(data.user);
}

function iniciarApp(user) {
  currentUser = user;
  isAdmin = user.email === ADMIN_EMAIL;
  currentSucursal = SUCURSAL_MAP[user.email] || '';
  document.getElementById('loginScreen').style.display = 'none';
  document.getElementById('appScreen').style.display = 'block';
  const badge = document.getElementById('userBadge');
  if (isAdmin) { badge.textContent = 'Admin'; badge.className = 'user-badge badge-adm'; }
  else if (currentSucursal === 'madrazo') { badge.textContent = 'Madrazo'; badge.className = 'user-badge badge-mad'; }
  else { badge.textContent = 'Contadero'; badge.className = 'user-badge badge-con'; }
  if (isAdmin) document.getElementById('adminSucTabs').style.display = 'block';
  switchTab('calendario');
}

async function doLogout() {
  await sb.auth.signOut();
  document.getElementById('loginScreen').style.display = 'flex';
  document.getElementById('appScreen').style.display = 'none';
  document.getElementById('loginEmail').value = '';
  document.getElementById('loginPass').value = '';
  document.getElementById('loginBtn').textContent = 'Entrar';
  currentUser = null; isAdmin = false;
}

sb.auth.onAuthStateChange((event, session) => { if (session) iniciarApp(session.user); });

function switchTab(tab) {
  document.querySelectorAll('.nav-tab').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  const tabEl = document.getElementById('tab-' + tab);
  if (tabEl) tabEl.classList.add('active');
  document.getElementById('screen-' + tab).classList.add('active');
  if (tab === 'calendario') cargarCalendario();
  if (tab === 'historial') cargarHistorial();
  if (tab === 'captura') { }
}

function setAdminSuc(suc) {
  adminSuc = suc;
  document.getElementById('st-mad').className = 'suc-tab' + (suc === 'madrazo' ? ' blue' : '');
  document.getElementById('st-con').className = 'suc-tab' + (suc === 'contadero' ? ' teal' : '');
  cargarCalendario();
}

async function cargarCalendario() {
  const suc = isAdmin ? adminSuc : currentSucursal;
  const desde = new Date(calYear, calMonth, 1).toISOString().split('T')[0];
  const hasta = new Date(calYear, calMonth + 1, 0).toISOString().split('T')[0];
  const { data } = await sb.from('registros').select('fecha,venta_total').eq('sucursal', suc).gte('fecha', desde).lte('fecha', hasta);
  registros = data || [];
  renderCalendario(suc);
}

function renderCalendario(suc) {
  document.getElementById('calTitle').textContent = MESES[calMonth] + ' ' + calYear;
  const grid = document.getElementById('calGrid');
  grid.innerHTML = '';
  DIAS.forEach(d => { const el = document.createElement('div'); el.className = 'cal-day-name'; el.textContent = d; grid.appendChild(el); });
  const firstDay = new Date(calYear, calMonth, 1).getDay();
  const daysInMonth = new Date(calYear, calMonth + 1, 0).getDate();
  const today = new Date(); today.setHours(0,0,0,0);
  for (let i = 0; i < firstDay; i++) { const el = document.createElement('div'); el.className = 'cal-day empty'; grid.appendChild(el); }
  for (let d = 1; d <= daysInMonth; d++) {
    const fecha = calYear + '-' + String(calMonth+1).padStart(2,'0') + '-' + String(d).padStart(2,'0');
    const date = new Date(calYear, calMonth, d);
    const reg = registros.find(r => r.fecha === fecha);
    const el = document.createElement('div');
    el.innerHTML = '<span>' + d + '</span>';
    if (date > today) {
      el.className = 'cal-day future';
    } else if (reg) {
      el.className = isAdmin ? 'cal-day done-admin' : 'cal-day done';
      el.innerHTML += '<div class="dot"></div>';
      if (isAdmin) el.onclick = () => abrirCaptura(fecha, suc, reg);
    } else {
      el.className = 'cal-day pending';
      if (date.toDateString() === today.toDateString()) el.classList.add('today');
      el.onclick = () => abrirCaptura(fecha, suc, null);
    }
    grid.appendChild(el);
  }
}

function cambiarMes(dir) {
  calMonth += dir;
  if (calMonth > 11) { calMonth = 0; calYear++; }
  if (calMonth < 0) { calMonth = 11; calYear--; }
  cargarCalendario();
}

function abrirCaptura(fecha, suc, regExistente) {
  selectedDate = fecha;
  const [y, m, d] = fecha.split('-');
  document.getElementById('dayBadge').textContent = (isAdmin ? (suc === 'madrazo' ? 'Madrazo' : 'Contadero') + ' — ' : '') + d + ' de ' + MESES[parseInt(m)-1] + ' ' + y;
  limpiarForm();
  if (regExistente) {
    document.getElementById('ventaRow').textContent = fmt(regExistente.venta_total);
    document.getElementById('fieldsCard').classList.add('active');
  }
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById('screen-captura').classList.add('active');
  document.querySelectorAll('.nav-tab').forEach(t => t.classList.remove('active'));
}

async function loadPDF(input) {
  const file = input.files[0]; if (!file) return;
  document.getElementById('fname').textContent = file.name;
  document.getElementById('dropzone').classList.add('loaded');
  document.getElementById('ventaRow').textContent = 'Leyendo...';
  const ab = await file.arrayBuffer();
  const pdf = await pdfjsLib.getDocument({ data: ab }).promise;
  let txt = '';
  for (let i = 1; i <= pdf.numPages; i++) {
    const pg = await pdf.getPage(i);
    const tc = await pg.getTextContent();
    txt += tc.items.map(x => x.str).join(' ') + '\n';
  }
  const patterns = [
    /Venta\s+Neta\s*\+\s*Iva\s+\$?([\d,]+\.?\d{0,2})/i,
    /Total\s+\$?([\d,]+\.\d{2})\s+\$?([\d,]+\.\d{2})\s*$/im,
  ];
  let found = null;
  for (const p of patterns) {
    const m = txt.match(p);
    if (m) {
      const candidates = m.slice(1).map(v => parseFloat((v||'0').replace(/,/g,'')));
      found = Math.max(...candidates.filter(v => v > 1000));
      if (found > 0) break;
    }
  }
  if (!found || found <= 0) {
    const all = [...txt.matchAll(/\$\s*([\d,]+\.\d{2})/g)].map(m => parseFloat(m[1].replace(/,/g,''))).filter(v => v > 5000 && v < 500000);
    if (all.length) found = all.sort((a,b) => b-a)[0];
  }
  ventaPDF = found || null;
  document.getElementById('ventaRow').textContent = ventaPDF ? fmt(ventaPDF) : 'No encontrado';
  if (ventaPDF) document.getElementById('fieldsCard').classList.add('active');
  recalc();
}

function fmt(n) {
  if (n === null || n === undefined) return '—';
  return '$' + Number(n).toLocaleString('es-MX', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}
function val(id) { return parseFloat(document.getElementById(id).value) || 0; }

function recalc() {
  const total = val('dep1') + val('dep2') + val('cred') + val('deb') + val('amex');
  document.getElementById('totalCap').textContent = fmt(total);
  const db = document.getElementById('diffBox');
  const sb2 = document.getElementById('submitBtn');
  if (!ventaPDF || total === 0) { db.innerHTML = ''; sb2.disabled = true; return; }
  const diff = Math.abs(total - ventaPDF);
  if (diff < 1) {
    db.innerHTML = `<div class="diff-box diff-ok"><span class="diff-lbl">Cuadrado</span><span class="diff-val">${fmt(ventaPDF)}</span></div>`;
    sb2.disabled = false;
  } else {
    const signo = total > ventaPDF ? 'Sobra' : 'Falta';
    db.innerHTML = `<div class="diff-box diff-err"><span class="diff-lbl">${signo} ${fmt(diff)}</span><span class="diff-val">No cuadra</span></div>`;
    sb2.disabled = true;
  }
}

async function enviar() {
  const sm = document.getElementById('statusMsg');
  sm.className = 'status-msg'; sm.textContent = 'Registrando...';
  document.getElementById('submitBtn').disabled = true;
  const suc = isAdmin ? adminSuc : currentSucursal;
  const payload = {
    fecha: selectedDate, sucursal: suc,
    venta_total: ventaPDF, deposito1: val('dep1'), deposito2: val('dep2'),
    credito: val('cred'), debito: val('deb'), amex: val('amex'),
    total_capturado: val('dep1')+val('dep2')+val('cred')+val('deb')+val('amex'),
    completado: true
  };
  const { error } = await sb.from('registros').upsert(payload, { onConflict: 'fecha,sucursal' });
  if (error) {
    sm.className = 'status-msg err'; sm.textContent = 'Error al guardar. Intenta de nuevo.';
    document.getElementById('submitBtn').disabled = false; return;
  }
  try {
    await fetch(SCRIPT_URL, { method: 'POST', body: JSON.stringify({ sucursal: suc, fecha: selectedDate, ventaTotal: ventaPDF, deposito1: val('dep1'), deposito2: val('dep2'), credito: val('cred'), debito: val('deb'), amex: val('amex'), totalCapturado: payload.total_capturado }), mode: 'no-cors' });
  } catch(e) {}
  sm.className = 'status-msg ok'; sm.textContent = 'Día registrado correctamente.';
  setTimeout(() => switchTab('calendario'), 1500);
}

function limpiarForm() {
  ['dep1','dep2','cred','deb','amex'].forEach(id => document.getElementById(id).value = '');
  document.getElementById('pdfIn').value = '';
  document.getElementById('fname').textContent = '';
  document.getElementById('dropzone').classList.remove('loaded');
  document.getElementById('fieldsCard').classList.remove('active');
  document.getElementById('ventaRow').textContent = '—';
  document.getElementById('totalCap').textContent = '$0.00';
  document.getElementById('diffBox').innerHTML = '';
  document.getElementById('statusMsg').textContent = '';
  document.getElementById('submitBtn').disabled = true;
  ventaPDF = null;
}

async function cargarHistorial() {
  document.getElementById('histContent').innerHTML = '<div class="hist-empty">Cargando...</div>';
  let query = sb.from('registros').select('*').order('fecha', { ascending: false });
  if (!isAdmin) query = query.eq('sucursal', currentSucursal);
  const { data } = await query;
  const todos = data || [];
  renderStats(todos);
  renderHist(todos);
}

function renderStats(todos) {
  const mad = todos.filter(r => r.sucursal === 'madrazo');
  const con = todos.filter(r => r.sucursal === 'contadero');
  const sum = arr => arr.reduce((a,b) => a + (b.venta_total||0), 0);
  const grid = document.getElementById('statsGrid');
  if (isAdmin) {
    grid.innerHTML = `
      <div class="stat-card"><div class="stat-label">Madrazo — días registrados</div><div class="stat-val">${mad.length}</div><div class="stat-sub">Total: ${fmt(sum(mad))}</div></div>
      <div class="stat-card"><div class="stat-label">Contadero — días registrados</div><div class="stat-val">${con.length}</div><div class="stat-sub">Total: ${fmt(sum(con))}</div></div>`;
  } else {
    grid.innerHTML = `
      <div class="stat-card"><div class="stat-label">Días registrados</div><div class="stat-val">${todos.length}</div></div>
      <div class="stat-card"><div class="stat-label">Venta acumulada</div><div class="stat-val">${fmt(sum(todos))}</div></div>`;
  }
}

function filtrarHist(f) {
  histFiltro = f;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('f-' + f).classList.add('active');
  sb.from('registros').select('*').order('fecha', { ascending: false }).then(({ data }) => renderHist(data || []));
}

function renderHist(todos) {
  let lista = todos;
  if (histFiltro !== 'todos') lista = todos.filter(r => r.sucursal === histFiltro);
  if (!isAdmin) lista = todos.filter(r => r.sucursal === currentSucursal);
  const el = document.getElementById('histContent');
  if (!lista.length) { el.innerHTML = '<div class="hist-empty">No hay registros aún.</div>'; return; }
  el.innerHTML = '<div class="hist-list">' + lista.map(r => {
    const [y,m,d] = r.fecha.split('-');
    return `<div class="hist-item">
      <div class="hist-left">
        <span class="hist-fecha">${d} de ${MESES[parseInt(m)-1]} ${y}</span>
        <span class="hist-suc">${r.sucursal.charAt(0).toUpperCase()+r.sucursal.slice(1)}</span>
      </div>
      <span class="hist-venta">${fmt(r.venta_total)}</span>
    </div>`;
  }).join('') + '</div>';
}
</script>
